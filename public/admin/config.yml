# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  repo: fblaze62/blog
  branch: main
  base_url: https://auth.fblaze62.top/

locale: zh_CN

app_title: 管理 - FeatherBlaze's Blog

logo:
  src: https://gcore.jsdelivr.net/gh/fblaze62/blog/src/assets/images/avatar-round.png
  show_in_header: true

media_folder: /public/assets/images
public_folder: /assets/images

asset_collections:
  - name: post-images
    label: 文章配图
    icon: post_add
    media_folder: /src/content/posts/images
    public_folder: /images
  - name: dynamic-images
    label: 动态配图
    icon: forum
    media_folder: /src/content/dynamic/images
    public_folder: /images
  - name: assets
    label: 站点资源
    icon: folder_open
    media_folder: /public/assets
    public_folder: /assets
  - name: images
    label: 站点图片
    icon: image
    media_folder: /src/assets/images
    public_folder: /assets/images
  - name: fonts
    label: 站点字体
    icon: font_download
    media_folder: /public/assets/fonts
    public_folder: /assets/fonts
  - name: gallery
    label: 站点相册
    icon: gallery_thumbnail
    media_folder: /public/assets/gallery
    public_folder: /assets/gallery
  - name: music
    label: 站点音乐
    icon: library_music
    media_folder: /public/assets/music
    public_folder: /assets/music
  - name: music_cover
    label: 音乐封面
    icon: album
    media_folder: /public/assets/music/cover
    public_folder: /assets/music/cover
  - name: favicon
    label: 站点图标
    icon: star
    media_folder: /public/favicon
    public_folder: /favicon

collections:
  - name: posts
    label: 📝 博客文章
    folder: src/content/posts
    media_folder: /src/content/posts/images
    public_folder: /images
    create: true
    format: yaml-frontmatter
    extension: md
    slug: "{{slug}}"
    summary: "{{title}} | 发布于 {{published}} | 更新于 {{updated}} | 标签: {{tags}} | 分类: {{category}} | 草稿: {{draft}} | 置顶: {{pinned}}"
    sortable_fields:
      fields: [title, published, tags, category, draft, pinned]
      default:
        field: published
        direction: descending
    fields:
      - { name: title, label: 标题, widget: string }
      - { name: published, label: 发布时间, widget: datetime, type: date, format: YYYY-MM-DD }
      - { name: updated, label: 更新时间, widget: datetime, type: date, format: YYYY-MM-DD }
      - { name: draft, label: 草稿, widget: boolean, default: false }
      - { name: description, label: 文章摘要, widget: string, required: false }
      - { name: image, label: 封面图, widget: image, required: false }
      - { name: tags, label: 标签, widget: list }
      - { name: category, label: 分类, widget: string }
      - { name: lang, label: 语言, widget: select, options: [{ label: 中文, value: "" }, { label: English, value: en }, { label: 日本語, value: ja }, { label: 繁體中文, value: zh_TW }, { label: Русский, value: ru }], required: false }
      - { name: pinned, label: 置顶, widget: boolean, default: false }
      - { name: author, label: 作者, widget: string, required: false }
      - { name: sourceLink, label: 原文链接, widget: string, required: false }
      - { name: licenseName, label: 许可协议名称, widget: string, required: false }
      - { name: licenseUrl, label: 许可协议链接, widget: string, required: false }
      - { name: comment, label: 启用评论, widget: boolean, default: true }
      - { name: password, label: 文章密码, widget: string, required: false }
      - { name: passwordHint, label: 密码提示, widget: string, required: false }
      - { name: body, label: 正文, widget: richtext, required: true }
  - name: dynamic
    label: 📓 个人动态
    folder: src/content/dynamic
    media_folder: /src/content/dynamic/images
    public_folder: /images
    create: true
    format: yaml-frontmatter
    extension: md
    slug: "{{slug}}"
    summary: "{{published}} | 地点: {{location}} | 置顶: {{pinned}}"
    sortable_fields:
      fields: [published]
      default:
        field: published
        direction: descending
    fields:
      - { name: published, label: 发布时间, widget: datetime, type: datetime, format: YYYY-MM-DD HH:mm:ss, pattern: true }
      - { name: location, label: 发布地点, widget: string, required: false }
      - { name: pinned, label: 置顶, widget: boolean, default: false }
      - { name: body, label: 正文, widget: richtext, required: true }
  - name: pages
    label: 📄 页面
    files:
      - name: about
        label: 📄 关于页面
        file: src/content/spec/about.md
        format: yaml-frontmatter
        fields:
          - { name: body, label: 正文, widget: richtext }
      - name: friends
        label: 🔗 友情链接
        file: src/content/spec/friends.mdx
        format: raw
        fields:
          - name: body
            label: 配置
            widget: code
            required: true
            output_code_only: true
            default_language: jsx
      - name: guestbook
        label: 📝 留言板
        file: src/content/spec/guestbook.md
        format: yaml-frontmatter
        fields:
          - { name: title, label: 页面标题, widget: string, default: "留言板" }
          - { name: body, label: 正文, widget: richtext }
  - name: site-settings
    label: ⚙️ 站点设置
    files:
      - name: site-config
        label: 🌐 站点主配置
        file: src/config/siteConfig.ts
        format: raw
        fields:
          - name: body
            label: 配置
            widget: code
            required: true
            output_code_only: true
            default_language: typescript
      - name: profile-config
        label: 👤 个人信息
        file: src/config/profileConfig.ts
        format: raw
        fields:
          - name: body
            label: 配置
            widget: code
            required: true
            output_code_only: true
            default_language: typescript
      - name: announcement-config
        label: 📢 公告栏
        file: src/config/announcementConfig.ts
        format: raw
        fields:
